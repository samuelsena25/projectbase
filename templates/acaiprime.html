<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento - Açai Prime</title>

    <link rel="stylesheet" href="/static/css/normalize.css">
    <link rel="stylesheet" href="/static/css/acaiprime.css">

    <script defer src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>
    <header>
        <h1>Gerenciamento financeiro - Açaí Prime</h1>
    </header>

    <section>
        <form class="form-box">
            <div class="field">
                <label for="form_total_value" class="info">Valor total recebido:</label>
                <input type="number" id="form_total_value" min="0" step="1" required>
            </div>

            <div class="field">
                <label for="form_total_orders" class="info">Total de pedidos do período:</label>
                <input type="number" id="form_total_orders" min="0" step="1" required>
            </div>

            <div class="field">
                <label for="form_my_deliveries" class="info">Quantia de entregas feitas por mim:</label>
                <input type="number" id="form_my_deliveries" min="0" step="1" required>
            </div>

            <div class="field">
                <label for="form_maria_orders">Total de montagens da Maria:</label>
                <input type="number" id="form_maria_orders" min="0" step="1" required>
            </div>

            <button type="button" id="btnCalcular">Calcular</button>
        </form>
        <div class="resultSection">
            <h2>Resultado</h2>
            <div id="resultBox" class="resultBox">
                <div id="resultPart1" class="resultPart1">teste</div>
                <div id="resultPart2" class="resultPart2">teste</div>
            </div>
        </div>
    </section>

    <footer>
        <p>rodapé</p>
    </footer>
</body>
</html>
